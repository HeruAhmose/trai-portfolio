name: prestige-estate-insert
on:
  push:
    branches: [feat/prestige-estate-20260823]
permissions:
  contents: write
jobs:
  insert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/prestige-estate-20260823
      - name: Insert constellation into estate homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('client/src/pages/Home.tsx')
          s=p.read_text(encoding='utf-8')
          anchor='import { useEffect, useState } from "react";'
          assert anchor in s and 'EstateConstellation' not in s
          s=s.replace(anchor, anchor+'\nimport EstateConstellation from "@/components/EstateConstellation";',1)
          marker='      {/* Portfolio Sections with Parallax */}'
          assert marker in s
          s=s.replace(marker,'      <EstateConstellation />\n\n'+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write client/src/pages/Home.tsx client/src/components/EstateConstellation.tsx
      - run: |
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/Home.tsx client/src/components/EstateConstellation.tsx
          git commit -m 'feat(estate): reveal seven-organ civilization architecture'
          git push origin HEAD:feat/prestige-estate-20260823
