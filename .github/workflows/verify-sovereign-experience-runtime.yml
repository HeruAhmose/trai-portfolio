name: Verify sovereign experience runtime

on:
  push:
    branches:
      - fix/sovereign-experience-runtime-20260910

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify repair scope
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          changed="$(git diff --name-only origin/main...HEAD | sort)"
          printf '%s\n' "$changed"
          expected=$'.github/workflows/verify-sovereign-experience-runtime.yml\nclient/index.html\nclient/public/favicon.svg\nclient/src/App.tsx\nclient/src/components/CeremonialIntro.tsx\nclient/src/components/PremiumNavigation.tsx\nclient/src/components/SovereignAudioEngine.tsx\nclient/src/components/SovereignCursor.tsx\nclient/src/contexts/SoundPreferencesContext.tsx\nclient/src/hooks/useAudioManager.ts\nclient/src/hooks/useSovereignSound.ts\npackage.json\nscripts/audit-experience-runtime.mjs\nscripts/reset-audit-browser.mjs'
          test "$changed" = "$expected"
          test -z "$(git diff --name-only origin/main...HEAD -- package-lock.json)"
          grep -Fq 'enabled: false' client/src/contexts/SoundPreferencesContext.tsx
          grep -Fq "window.dispatchEvent(new CustomEvent('trai:sfx'" client/src/hooks/useSovereignSound.ts
          grep -Fq 'data-sovereign-route-motion="true"' client/src/App.tsx
          grep -Fq 'data-intro-sound-toggle="true"' client/src/components/CeremonialIntro.tsx
          grep -Fq 'data-sovereign-cursor="true"' client/src/components/SovereignCursor.tsx
          grep -Fq 'href="%BASE_URL%favicon.svg"' client/index.html
          test -s client/public/favicon.svg
          if grep -R -Fq 'd2xsxph8kpxj0f.cloudfront.net' client/src/hooks/useAudioManager.ts client/src/hooks/useSovereignSound.ts client/src/components/SovereignAudioEngine.tsx; then
            echo '::error::Sovereign audio path still depends on the retired CloudFront SFX host.'
            exit 1
          fi
          echo 'EXPERIENCE_SCOPE=PASS'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependency graph
        run: npm ci --prefer-offline --ignore-scripts

      - name: Dependency audit through low
        run: npm audit --audit-level=low

      - name: Type and verified-facts checks
        run: npm run check

      - name: Build GitHub Pages artifact
        run: |
          set -euo pipefail
          rm -rf dist/public
          npm exec -- vite build --base /trai-portfolio/
          grep -R -Fq 'data-sovereign-audio-control' dist/public/assets
          grep -R -Fq 'data-sovereign-route-motion' dist/public/assets
          grep -R -Fq 'data-intro-sound-toggle' dist/public/assets
          grep -R -Fq 'data-sovereign-cursor' dist/public/assets
          grep -R -Fq 'trai:sfx' dist/public/assets
          grep -Fq 'href="/trai-portfolio/favicon.svg"' dist/public/index.html
          test -s dist/public/favicon.svg
          if grep -R -Eq 'sfx-(click|hover|success|error|transition|loading)_[a-f0-9]+\.wav' dist/public/assets; then
            echo '::error::Active build still carries legacy external SFX asset references.'
            grep -RIlE 'sfx-(click|hover|success|error|transition|loading)_[a-f0-9]+\.wav' dist/public/assets || true
            exit 1
          fi
          echo 'EXPERIENCE_BUILD_CONTRACT=PASS'

      - name: Execute full built-site and experience audits in Chrome
        run: |
          set -euo pipefail
          rm -rf /tmp/trai-pages-root /tmp/trai-chrome
          mkdir -p /tmp/trai-pages-root/trai-portfolio
          cp -a dist/public/. /tmp/trai-pages-root/trai-portfolio/

          for route in case-studies materials community research timeline patent-claims energy manufacturing quantum applications true-melange queen-califia mela-nation melanina nu-ta-meri trai-coin founder peoples-foundation contact; do
            mkdir -p "/tmp/trai-pages-root/trai-portfolio/$route"
            cp dist/public/index.html "/tmp/trai-pages-root/trai-portfolio/$route/index.html"
          done

          python3 -m http.server 4173 --directory /tmp/trai-pages-root >/tmp/trai-http.log 2>&1 &
          server_pid=$!
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          "$chrome" \
            --headless --no-sandbox --no-first-run \
            --remote-allow-origins='*' \
            --remote-debugging-port=9222 --user-data-dir=/tmp/trai-chrome \
            --disable-background-networking --disable-component-update \
            --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader \
            http://127.0.0.1:4173/trai-portfolio/ \
            >/tmp/trai-chrome.log 2>&1 &
          chrome_pid=$!

          cleanup() {
            kill "$chrome_pid" 2>/dev/null || true
            kill "$server_pid" 2>/dev/null || true
            wait "$chrome_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 50); do
            curl --fail --silent http://127.0.0.1:9222/json >/tmp/targets.json && break
            sleep 0.4
          done
          test -s /tmp/targets.json

          timeout --kill-after=5s 240s npm run audit:built
          cat /tmp/trai-browser-audit.json
          cat /tmp/trai-experience-audit.json
          node -e "const a=require('/tmp/trai-browser-audit.json'), b=require('/tmp/trai-experience-audit.json'); if(a.summary.failed!==0 || a.summary.runtimeIssues!==0 || b.summary.failures!==0) process.exit(1); console.log('FULL_BROWSER_AND_EXPERIENCE_AUDIT=PASS')"

          if grep -Fq '/api/trpc/' /tmp/trai-http.log; then
            echo '::error::Static Pages runtime attempted a server-only tRPC request.'
            exit 1
          fi
