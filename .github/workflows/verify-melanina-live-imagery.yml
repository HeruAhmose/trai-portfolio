name: Verify MeLaNiNa live imagery repair

on:
  push:
    branches:
      - fix/melanina-live-imagery-20260910

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Apply idempotent MeLaNiNa repair
        run: python3 .github/scripts/apply_melanina_live_imagery.py

      - name: Verify repair scope
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test "$changed" = $'client/src/pages/MeLaNiNa.tsx\nscripts/check-facts.mjs' || test -z "$changed"
          grep -Fq 'data-melanina-collection-archive="true"' client/src/pages/MeLaNiNa.tsx
          grep -Fq 'VIDEO.melanina.poster' client/src/pages/MeLaNiNa.tsx
          grep -Fq 'PROVENANCE_LABEL[VIDEO.melanina.provenance]' client/src/pages/MeLaNiNa.tsx
          grep -Fq 'file: "client/src/pages/MeLaNiNa.tsx"' scripts/check-facts.mjs

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Install locked graph
        run: npm ci --prefer-offline --ignore-scripts

      - name: Type and evidence checks
        run: npm run check

      - name: Build Pages artifact and verify registered visual
        run: |
          set -euo pipefail
          rm -rf dist/public
          npm exec -- vite build --base /trai-portfolio/
          grep -R -Fq 'data-melanina-collection-archive' dist/public/assets
          grep -R -Fq 'melanina-poster.jpg' dist/public/assets
          test -s dist/public/media/video/melanina-poster.jpg
          test -s dist/public/media/video/melanina.mp4
          echo 'MELANINA_BUILD_IDENTITY=PASS'

      - name: Reproduce production browser audit and MeLaNiNa render
        run: |
          set -euo pipefail
          rm -rf /tmp/trai-pages-root /tmp/trai-chrome /tmp/trai-melanina-chrome
          mkdir -p /tmp/trai-pages-root/trai-portfolio
          cp -a dist/public/. /tmp/trai-pages-root/trai-portfolio/
          for route in case-studies materials community research timeline patent-claims energy manufacturing quantum applications true-melange queen-califia mela-nation melanina nu-ta-meri trai-coin founder peoples-foundation contact; do
            mkdir -p "/tmp/trai-pages-root/trai-portfolio/$route"
            cp dist/public/index.html "/tmp/trai-pages-root/trai-portfolio/$route/index.html"
          done

          python3 -m http.server 4173 --directory /tmp/trai-pages-root >/tmp/trai-http.log 2>&1 &
          server_pid=$!
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          "$chrome" \
            --headless --no-sandbox --no-first-run \
            --remote-allow-origins='*' \
            --remote-debugging-port=9222 --user-data-dir=/tmp/trai-chrome \
            --disable-background-networking --disable-component-update \
            --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader \
            http://127.0.0.1:4173/trai-portfolio/ \
            >/tmp/trai-chrome.log 2>&1 &
          chrome_pid=$!

          cleanup() {
            kill "$chrome_pid" 2>/dev/null || true
            kill "$server_pid" 2>/dev/null || true
            wait "$chrome_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 40); do
            curl --fail --silent http://127.0.0.1:9222/json >/tmp/targets.json && break
            sleep 0.5
          done
          test -s /tmp/targets.json
          timeout --kill-after=5s 180s npm run audit:built
          cat /tmp/trai-browser-audit.json

          timeout 60s "$chrome" \
            --headless --no-sandbox --no-first-run \
            --user-data-dir=/tmp/trai-melanina-chrome \
            --disable-background-networking --disable-component-update \
            --virtual-time-budget=7000 --dump-dom \
            http://127.0.0.1:4173/trai-portfolio/melanina/ \
            >/tmp/melanina.html
          grep -Fq 'data-melanina-collection-archive="true"' /tmp/melanina.html
          grep -Fq 'MeLaNiNa Collection 001 — Pyramid No Scheme source rendering' /tmp/melanina.html
          grep -Fq '/trai-portfolio/media/video/melanina-poster.jpg' /tmp/melanina.html
          curl --fail --silent http://127.0.0.1:4173/trai-portfolio/media/video/melanina-poster.jpg >/dev/null
          echo 'MELANINA_LOCAL_BROWSER_RENDER=PASS'

      - name: Commit verified repair when needed
        run: |
          set -euo pipefail
          if git diff --quiet -- client/src/pages/MeLaNiNa.tsx scripts/check-facts.mjs; then
            echo 'MELANINA_REPAIR_ALREADY_COMMITTED=PASS'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/MeLaNiNa.tsx scripts/check-facts.mjs
          git commit -m 'fix(melanina): restore registered collection imagery'
          git push origin HEAD:fix/melanina-live-imagery-20260910
