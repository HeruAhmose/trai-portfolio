name: Security Remediation Verify

on:
  push:
    branches:
      - agent/dependency-zero-audit-20260816
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dependency-zero-audit-20260816
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate authoritative npm lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Install frozen graph
        run: npm ci --ignore-scripts
      - name: Audit through low
        run: npm audit --audit-level=low
      - name: Verified-facts guard
        run: npm run check:facts
      - name: Typecheck
        run: npm exec -- tsc --noEmit
      - name: Production build
        env:
          VITE_SITE_URL: https://trai.org
        run: npm exec -- vite build
      - name: Persist regenerated lock if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(security): regenerate npm lockfile"
          git push origin HEAD:agent/dependency-zero-audit-20260816
