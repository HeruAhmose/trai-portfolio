name: MediaPipe drawing-utils prune

on:
  push:
    branches: [security/remove-unused-mediapipe-drawing-utils-20260817]
    paths:
      - .github/workflows/mediapipe-drawing-utils-prune.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/remove-unused-mediapipe-drawing-utils-20260817
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Remove drawing-utils with npm
        shell: bash
        run: |
          set -euo pipefail
          npm uninstall @mediapipe/drawing_utils --package-lock-only --ignore-scripts
      - name: Prove locked graph installs
        run: npm ci --ignore-scripts
      - name: Verify scope and active Tasks Vision remains
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const p = require('./package.json');
          if (p.dependencies?.['@mediapipe/drawing_utils']) throw new Error('drawing_utils still present');
          if (p.dependencies?.['@mediapipe/tasks-vision'] !== '^0.10.34') throw new Error('tasks-vision changed unexpectedly');
          NODE
          unexpected="$(git status --porcelain --untracked-files=no | grep -Ev '^ M (package.json|package-lock.json)$' || true)"
          test -z "$unexpected"
      - name: Commit generated graph
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "security: remove unused MediaPipe drawing utils"
          git push
