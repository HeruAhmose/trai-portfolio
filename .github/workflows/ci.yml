name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependency graph
        run: npm ci --prefer-offline --ignore-scripts

      - name: Dependency audit through low
        run: npm audit --audit-level=low

      - name: Legacy vendor exclusion guard
        shell: bash
        run: |
          set -euo pipefail
          legacy_vendor="$(printf '\155\141\156\165\163')"
          legacy_pkg="vite-plugin-${legacy_vendor}-runtime"
          if git grep -niE "$legacy_vendor" -- .; then
            echo "::error::legacy vendor reference re-entered tracked source/config"
            exit 1
          fi
          if npm ls "$legacy_pkg" >/dev/null 2>&1; then
            echo "::error::legacy vendor runtime package re-entered dependency graph"
            exit 1
          fi

      # Runs before anything is built. A fabricated validation, an implied
      # credential, or a coherence figure that has lost its hypothesis label
      # stops the pipeline here.
      - name: Verified-facts guard
        run: npm run check:facts

      - name: Organism visual contract
        run: node scripts/check-organism-visuals.mjs

      - name: Typecheck
        run: npm exec -- tsc --noEmit

      # Protect the portfolio's advanced interactions and server integrations
      # before dependency migrations are allowed to merge. Synthetic values
      # exercise key-format/distinctness tests without exposing real secrets.
      - name: Advanced feature regression suite
        env:
          CLAUDE_API_KEY_HL: sk-ant-api03-ci-hl-0000000000000000000000000000000000000000
          CLAUDE_API_KEY_QC: sk-ant-api03-ci-qc-1111111111111111111111111111111111111111
        run: npm exec -- vitest run

      - name: Build
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL || 'https://trai.org' }}
        run: npm exec -- vite build

      - name: Verify build output
        run: |
          test -f dist/public/index.html || { echo "::error::index.html missing"; exit 1; }
          test -d dist/public/media     || { echo "::error::media/ missing"; exit 1; }
          test -f dist/public/og.png    || { echo "::error::og.png missing"; exit 1; }
          if grep -RniE '__trai_dev__|__TRAI_DEV_OBSERVER__|trai-dev-observer|\.trai-dev-logs' dist/public; then
            echo "::error::development observability leaked into production artifacts"
            exit 1
          fi
          echo "build output verified"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/public/
          retention-days: 7
