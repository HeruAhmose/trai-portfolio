name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: pnpm run check

      - name: Run tests
        run: pnpm test

      - name: Build GitHub Pages artifact
        env:
          VITE_BASE_PATH: /trai-portfolio/
          VITE_SITE_URL: https://heruahmose.github.io/trai-portfolio/
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: pnpm run pages:build

      - name: Verify build output
        shell: bash
        run: |
          test -f dist/public/index.html
          test -f dist/public/404.html
          test -f dist/public/.nojekyll
          test -f dist/public/og.png

          if grep -Eq '(src|href)="/assets/|href="/manifest.json"' dist/public/index.html; then
            echo "::error::The Pages artifact contains root-relative asset paths."
            exit 1
          fi

          grep -q '/trai-portfolio/assets/' dist/public/index.html
          grep -q '/trai-portfolio/manifest.json' dist/public/index.html

      - name: Upload verified artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/public/
          retention-days: 7