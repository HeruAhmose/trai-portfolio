name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build portfolio
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: pnpm run check

      - name: Build GitHub Pages artifact
        env:
          VITE_BASE_PATH: /trai-portfolio/
          VITE_SITE_URL: https://heruahmose.github.io/trai-portfolio/
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "${VITE_API_BASE_URL:-}" ]; then
            echo "::notice::API_BASE_URL is not configured; deploying the public static portfolio without external API features."
          fi

          pnpm run pages:build

      - name: Verify GitHub Pages paths
        shell: bash
        run: |
          test -f dist/public/index.html
          test -f dist/public/404.html
          test -f dist/public/.nojekyll

          if grep -Eq '(src|href)="/assets/|href="/manifest.json"' dist/public/index.html; then
            echo "::error::The Pages artifact contains root-relative asset paths."
            exit 1
          fi

          grep -q '/trai-portfolio/assets/' dist/public/index.html
          grep -q '/trai-portfolio/manifest.json' dist/public/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/public

  deploy:
    name: Publish portfolio
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4