name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Guard and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependency graph
        run: npm ci --prefer-offline --ignore-scripts
      - name: Dependency audit through low
        run: npm audit --audit-level=low
      - name: Verified-facts guard
        run: npm run check:facts
      - name: Build GitHub Pages artifact
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$VITE_SITE_URL" ]; then
            echo "::warning::SITE_URL variable not set; building with the default domain."
          fi

          BASE_PATH="/trai-portfolio/"
          echo "Building with Vite base: $BASE_PATH"
          npm exec -- vite build --base "$BASE_PATH"

          printf '%s\n' "$GITHUB_SHA" > dist/public/deploy-commit.txt
          cat > dist/public/deployment-meta.json <<EOF
          {"sha":"$GITHUB_SHA","repository":"$GITHUB_REPOSITORY","ref":"$GITHUB_REF_NAME"}
          EOF

          cp dist/public/index.html dist/public/404.html
          touch dist/public/.nojekyll

          SPA_ROUTES="cinematic case-studies materials community research timeline
            patent-claims advanced-features energy manufacturing quantum
            applications dashboard annotations gesture-control sound-preferences
            projects career-timeline quantum-enhanced neural-training domain admin
            projects-showcase video-showcase gamification search api-docs
            ai-insights showcase true-melange queen-califia mela-nation melanina
            trai-coin founder peoples-foundation contact"

          for route in $SPA_ROUTES; do
            mkdir -p "dist/public/$route"
            cp dist/public/index.html "dist/public/$route/index.html"
          done

          for route in $SPA_ROUTES; do
            if ! cmp -s dist/public/index.html "dist/public/$route/index.html"; then
              echo "::error::Route /$route was not materialised from index.html."
              exit 1
            fi
          done

          if grep -Eq '(src|href)="/(assets/|manifest\.json|trai-ecosystem\.js|trai-organism-v5\.js|trai-cinematic\.js)' dist/public/index.html; then
            echo "::error::GitHub Pages build contains root-relative asset references."
            exit 1
          fi

          grep -q '/trai-portfolio/assets/' dist/public/index.html
          grep -q '/trai-portfolio/manifest.json' dist/public/index.html
          test -f dist/public/trai-organism-v5.js
          test -f dist/public/trai-organism-v5.json
          test -f dist/public/trai-coin/index.html
          cmp -s dist/public/index.html dist/public/trai-coin/index.html
          grep -R -Fq 'TRAI Coin' dist/public/assets
          test -s dist/public/deploy-commit.txt
          grep -Fqx "$GITHUB_SHA" dist/public/deploy-commit.txt
          grep -Fq '"sha":"'$GITHUB_SHA'"' dist/public/deployment-meta.json
          grep -q '/trai-portfolio/trai-organism-v5.js' dist/public/index.html
          grep -q '/trai-portfolio/trai-cinematic.js' dist/public/index.html

      - name: Execute built Pages artifact in Chrome
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/trai-pages-root /tmp/trai-chrome
          mkdir -p /tmp/trai-pages-root/trai-portfolio
          cp -a dist/public/. /tmp/trai-pages-root/trai-portfolio/

          python3 -m http.server 4173 --directory /tmp/trai-pages-root >/tmp/trai-http.log 2>&1 &
          server_pid=$!

          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          "$chrome" \
            --headless --no-sandbox --no-first-run \
            --remote-debugging-port=9222 --user-data-dir=/tmp/trai-chrome \
            --disable-background-networking --disable-component-update \
            --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader \
            http://127.0.0.1:4173/trai-portfolio/ \
            >/tmp/trai-chrome.log 2>&1 &
          chrome_pid=$!

          cleanup() {
            kill "$chrome_pid" 2>/dev/null || true
            kill "$server_pid" 2>/dev/null || true
            wait "$chrome_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 40); do
            curl --fail --silent http://127.0.0.1:9222/json >/tmp/targets.json && break
            sleep 0.5
          done
          test -s /tmp/targets.json

          cat > /tmp/assert-trai-browser.mjs <<'NODE'
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          let target;
          for (let attempt = 0; attempt < 40; attempt += 1) {
            const targets = await fetch('http://127.0.0.1:9222/json').then(r => r.json());
            target = targets.find(t => t.type === 'page' && t.url.includes('/trai-portfolio/'));
            if (target) break;
            await sleep(250);
          }
          if (!target?.webSocketDebuggerUrl) throw new Error('TRAI page target not found');

          const ws = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            ws.addEventListener('open', resolve, { once: true });
            ws.addEventListener('error', reject, { once: true });
          });

          let id = 0;
          const pending = new Map();
          ws.addEventListener('message', event => {
            const message = JSON.parse(event.data);
            if (!message.id) return;
            const waiter = pending.get(message.id);
            if (!waiter) return;
            pending.delete(message.id);
            message.error ? waiter.reject(new Error(JSON.stringify(message.error))) : waiter.resolve(message.result);
          });

          function send(method, params = {}) {
            const messageId = ++id;
            return new Promise((resolve, reject) => {
              pending.set(messageId, { resolve, reject });
              ws.send(JSON.stringify({ id: messageId, method, params }));
            });
          }

          await send('Runtime.enable');
          let snapshot = null;
          for (let attempt = 0; attempt < 34; attempt += 1) {
            await sleep(500);
            const evaluated = await send('Runtime.evaluate', {
              expression: `JSON.stringify({
                rootChildren: document.getElementById('root')?.childElementCount || 0,
                text: (document.body?.innerText || '').slice(0, 12000),
                skipVisible: [...document.querySelectorAll('button')].some(button =>
                  button.textContent?.trim() === 'Skip' && button.getClientRects().length > 0
                )
              })`,
              returnByValue: true,
            });
            const raw = evaluated?.result?.value;
            if (!raw) continue;
            snapshot = JSON.parse(raw);
            const hasTRAI = /TRAI|Tamerian Renaissance Alliance Initiative/i.test(snapshot.text);
            if (snapshot.rootChildren > 0 && hasTRAI && !snapshot.skipVisible) break;
          }

          console.log(JSON.stringify(snapshot, null, 2));
          if (!snapshot) throw new Error('No DOM snapshot returned');
          if (snapshot.rootChildren <= 0) throw new Error('React root has no committed children');
          if (!/TRAI|Tamerian Renaissance Alliance Initiative/i.test(snapshot.text)) throw new Error('Expected TRAI content not found');
          if (snapshot.skipVisible) throw new Error('Ceremonial intro remained visible past watchdog window');
          ws.close();
          NODE

          timeout --kill-after=5s 30s node /tmp/assert-trai-browser.mjs
          if grep -Fq '/api/trpc/' /tmp/trai-http.log; then
            echo '::error::Static Pages runtime attempted a server-only tRPC request.'
            cat /tmp/trai-http.log
            exit 1
          fi
          echo 'STATIC_RUNTIME_API_LEAK=PASS'
          echo 'LOCAL_BROWSER_RENDER=PASS'

      - name: Package Pages artifact once
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/public

  pages:
    name: GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  certify:
    name: Public Pages certification
    needs: pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Require exact deployed SHA
        shell: bash
        run: |
          set -euo pipefail
          base='https://heruahmose.github.io/trai-portfolio'
          for _ in $(seq 1 30); do
            status="$(curl --silent --location --output /tmp/deploy-commit --write-out '%{http_code}' "$base/deploy-commit.txt")"
            if [ "$status" = 200 ] && [ "$(tr -d '\r\n' < /tmp/deploy-commit)" = "$GITHUB_SHA" ]; then
              break
            fi
            sleep 10
          done
          test "$(tr -d '\r\n' < /tmp/deploy-commit)" = "$GITHUB_SHA"
          curl --fail --silent --show-error --location "$base/deployment-meta.json" > /tmp/deployment-meta.json
          grep -Fq '"sha":"'$GITHUB_SHA'"' /tmp/deployment-meta.json
          curl --fail --silent --show-error --location "$base/trai-coin/" > /tmp/trai-coin.html
          grep -qi '<html' /tmp/trai-coin.html
          echo 'PUBLIC_DEPLOYMENT_IDENTITY=PASS'
          echo 'PUBLIC_TRAI_COIN_ROUTE=PASS'

      - name: Execute public URL in Chrome
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/trai-public-chrome
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          "$chrome" \
            --headless --no-sandbox --no-first-run \
            --remote-debugging-port=9223 --user-data-dir=/tmp/trai-public-chrome \
            --disable-background-networking --disable-component-update \
            --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader \
            https://heruahmose.github.io/trai-portfolio/ \
            >/tmp/trai-public-chrome.log 2>&1 &
          chrome_pid=$!
          trap 'kill "$chrome_pid" 2>/dev/null || true; wait "$chrome_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 40); do
            curl --fail --silent http://127.0.0.1:9223/json >/tmp/public-targets.json && break
            sleep 0.5
          done
          test -s /tmp/public-targets.json

          cat > /tmp/assert-trai-public.mjs <<'NODE'
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          let target;
          for (let attempt = 0; attempt < 40; attempt += 1) {
            const targets = await fetch('http://127.0.0.1:9223/json').then(r => r.json());
            target = targets.find(t => t.type === 'page' && t.url.includes('/trai-portfolio/'));
            if (target) break;
            await sleep(250);
          }
          if (!target?.webSocketDebuggerUrl) throw new Error('Public TRAI page target not found');

          const ws = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            ws.addEventListener('open', resolve, { once: true });
            ws.addEventListener('error', reject, { once: true });
          });
          let id = 0;
          const pending = new Map();
          ws.addEventListener('message', event => {
            const message = JSON.parse(event.data);
            if (!message.id) return;
            const waiter = pending.get(message.id);
            if (!waiter) return;
            pending.delete(message.id);
            message.error ? waiter.reject(new Error(JSON.stringify(message.error))) : waiter.resolve(message.result);
          });
          function send(method, params = {}) {
            const messageId = ++id;
            return new Promise((resolve, reject) => {
              pending.set(messageId, { resolve, reject });
              ws.send(JSON.stringify({ id: messageId, method, params }));
            });
          }
          await send('Runtime.enable');
          let snapshot = null;
          for (let attempt = 0; attempt < 34; attempt += 1) {
            await sleep(500);
            const evaluated = await send('Runtime.evaluate', {
              expression: `JSON.stringify({
                rootChildren: document.getElementById('root')?.childElementCount || 0,
                text: (document.body?.innerText || '').slice(0, 12000),
                skipVisible: [...document.querySelectorAll('button')].some(button =>
                  button.textContent?.trim() === 'Skip' && button.getClientRects().length > 0
                )
              })`,
              returnByValue: true,
            });
            const raw = evaluated?.result?.value;
            if (!raw) continue;
            snapshot = JSON.parse(raw);
            const hasTRAI = /TRAI|Tamerian Renaissance Alliance Initiative/i.test(snapshot.text);
            if (snapshot.rootChildren > 0 && hasTRAI && !snapshot.skipVisible) break;
          }
          console.log(JSON.stringify(snapshot, null, 2));
          if (!snapshot || snapshot.rootChildren <= 0) throw new Error('Public React root did not commit');
          if (!/TRAI|Tamerian Renaissance Alliance Initiative/i.test(snapshot.text)) throw new Error('Public TRAI content not found');
          if (snapshot.skipVisible) throw new Error('Public ceremonial intro remained visible past watchdog window');
          ws.close();
          NODE

          timeout --kill-after=5s 30s node /tmp/assert-trai-public.mjs
          echo 'PUBLIC_BROWSER_RENDER=PASS'
