name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build portfolio
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Validate source
        run: |
          npm run check:types
          npm run check:facts
          npm run check:assets
          npm run check:repository
      - name: Build GitHub Pages artifact
        env:
          VITE_BASE_PATH: /trai-portfolio/
          VITE_SITE_URL: https://heruahmose.github.io/trai-portfolio/
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "${VITE_API_BASE_URL:-}" ]; then
            echo "::notice::API_BASE_URL is not configured; deploying the static portfolio without an external API."
          fi

          npm run pages:build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    name: Publish portfolio
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4