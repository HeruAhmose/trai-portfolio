name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        required: true
        default: pages
        type: choice
        options: [pages, netlify, vercel]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Guard and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --prefer-offline --no-audit

      - name: Typecheck and verified-facts guard
        run: npm run check

      - name: Configure build target
        env:
          DEPLOY_TARGET: ${{ inputs.target }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$DEPLOY_TARGET" == "pages" ]]; then
            echo "VITE_BASE_PATH=/trai-portfolio/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        shell: bash
        run: |
          if [ -z "${VITE_SITE_URL:-}" ]; then
            echo "::warning::SITE_URL is not set; the default site metadata will be used."
          fi

          if [ -z "${VITE_API_BASE_URL:-}" ]; then
            echo "::notice::API_BASE_URL is not set; the static portfolio will deploy without an external API."
          fi

          npm run pages:build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/public/

  pages:
    name: GitHub Pages
    if: github.event_name == 'push' || inputs.target == 'pages'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4

  netlify:
    name: Netlify
    if: inputs.target == 'netlify'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@17 deploy --dir=dist --prod

  vercel:
    name: Vercel
    if: inputs.target == 'vercel'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy dist --prod --yes --token "$VERCEL_TOKEN"