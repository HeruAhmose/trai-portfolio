name: Live production empirical audit

on:
  push:
    branches:
      - audit/live-production-20260909

permissions:
  contents: read

jobs:
  live-browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Prepare isolated Playwright runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/trai-live-audit
          cp scripts/live-production-audit.mjs /tmp/trai-live-audit/live-production-audit.mjs
          cd /tmp/trai-live-audit
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Audit deployed sites in real Chromium
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd /tmp/trai-live-audit
          node live-production-audit.mjs 2>&1 | tee audit.log
          status=${PIPESTATUS[0]}
          cp audit.log live-audit-evidence/audit.log
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish empirical browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-production-browser-evidence-20260909
          path: /tmp/trai-live-audit/live-audit-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce hard-failure gate
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.audit.outputs.exit_code }}" != "0" ]]; then
            echo "Live production audit detected hard failures. See uploaded evidence."
            exit 1
          fi
