name: React plugin 6 migration

on:
  push:
    branches:
      - build/plugin-react6-20260817

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: build/plugin-react6-20260817
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Generate npm graph and validate application
        shell: bash
        env:
          CLAUDE_API_KEY_HL: sk-ant-api03-ci-hl-0000000000000000000000000000000000000000
          CLAUDE_API_KEY_QC: sk-ant-api03-ci-qc-1111111111111111111111111111111111111111
          VITE_SITE_URL: https://trai.org
        run: |
          set -euo pipefail
          npm install --save-dev --save-exact @vitejs/plugin-react@6.0.5 --package-lock-only --ignore-scripts
          npm ci --prefer-offline --ignore-scripts
          npm audit --audit-level=low
          npm run check:facts
          npm exec -- tsc --noEmit
          npm exec -- vitest run
          npm exec -- vite build
          test -f dist/public/index.html
          test -d dist/public/media
          test -f dist/public/og.png
          if grep -RniE '__trai_dev__|__TRAI_DEV_OBSERVER__|trai-dev-observer|\.trai-dev-logs' dist/public; then
            echo "::error::development observability leaked into production artifacts"
            exit 1
          fi
          git config user.name 'Heru_Ahmose'
          git config user.email 'aitconsult22@gmail.com'
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m 'build: migrate Vite React plugin to 6.0.5'
          git push origin HEAD:build/plugin-react6-20260817
