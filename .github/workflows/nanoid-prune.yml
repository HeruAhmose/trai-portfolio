name: nanoid prune

on:
  push:
    branches: [security/classify-nanoid-20260817]
    paths:
      - .github/workflows/nanoid-prune.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/classify-nanoid-20260817
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Remove direct nanoid pin with npm
        run: npm uninstall nanoid --package-lock-only --ignore-scripts
      - name: Prove locked graph installs
        run: npm ci --ignore-scripts
      - name: Verify generated scope
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const p = require('./package.json');
          if (p.dependencies?.nanoid || p.devDependencies?.nanoid) throw new Error('direct nanoid pin still present');
          if (p.dependencies?.['@mediapipe/tasks-vision'] !== '1.0.0') throw new Error('MediaPipe changed unexpectedly');
          NODE
          unexpected="$(git status --porcelain --untracked-files=no | grep -Ev '^ M (package.json|package-lock.json)$' || true)"
          test -z "$unexpected"
      - name: Commit generated graph
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "security: remove unused direct nanoid pin"
          git push
