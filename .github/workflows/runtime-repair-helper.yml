name: Runtime Repair Helper

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}

      - name: Apply exact CeremonialIntro fail-open patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('client/src/components/CeremonialIntro.tsx')
          text = path.read_text()

          replacements = [
            (
              '  const startRef = useRef<number>(0);\n',
              '  const startRef = useRef<number>(0);\n  const completedRef = useRef(false);\n',
            ),
            (
              '      if (t > dissolveStart + 1200) {\n        cancelAnimationFrame(rafRef.current);\n        setVisible(false);\n        setTimeout(onComplete, 400);\n        return;\n      }',
              '      if (t > dissolveStart + 1200) {\n        if (!completedRef.current) {\n          completedRef.current = true;\n          cancelAnimationFrame(rafRef.current);\n          setVisible(false);\n          window.setTimeout(onComplete, 400);\n        }\n        return;\n      }',
            ),
            (
              '    const t3 = setTimeout(() => setPhase("dissolve"), TOTAL * 0.83);\n\n    return () => {',
              '    const t3 = setTimeout(() => setPhase("dissolve"), TOTAL * 0.83);\n\n    // Independent fail-open: the intro may never be allowed to cover the site\n    // indefinitely if requestAnimationFrame, Canvas, WebGL, or a driver stalls.\n    const watchdog = window.setTimeout(() => {\n      if (completedRef.current) return;\n      completedRef.current = true;\n      cancelAnimationFrame(rafRef.current);\n      setVisible(false);\n      onComplete();\n    }, TOTAL + 2000);\n\n    return () => {',
            ),
            (
              '      clearTimeout(t3);\n    };\n  }, [onComplete]);',
              '      clearTimeout(t3);\n      clearTimeout(watchdog);\n    };\n    // Deliberately one lifetime per mounted intro. The parent passes an inline\n    // state transition; depending on that function would restart this effect.\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, []);',
            ),
            (
              '  const skip = () => {\n    cancelAnimationFrame(rafRef.current);\n    setVisible(false);\n    setTimeout(onComplete, 300);\n  };',
              '  const skip = () => {\n    if (completedRef.current) return;\n    completedRef.current = true;\n    cancelAnimationFrame(rafRef.current);\n    setVisible(false);\n    window.setTimeout(onComplete, 300);\n  };',
            ),
          ]

          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one match, found {count}: {old[:80]!r}')
            text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Verify and commit helper output
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'const completedRef = useRef(false);' client/src/components/CeremonialIntro.tsx
          grep -Fq 'const watchdog = window.setTimeout' client/src/components/CeremonialIntro.tsx
          grep -Fq 'TOTAL + 2000' client/src/components/CeremonialIntro.tsx
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/components/CeremonialIntro.tsx
          if git diff --cached --quiet; then
            echo 'No patch required.'
            exit 0
          fi
          git commit -m 'fix(runtime): make ceremonial intro fail open'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
