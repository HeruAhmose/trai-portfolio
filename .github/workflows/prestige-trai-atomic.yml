name: prestige-trai-atomic
on:
  push:
    branches: [feat/prestige-estate-20260823]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/prestige-estate-20260823
      - name: Apply estate constellation and narrative corrections atomically
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('client/src/pages/Home.tsx')
          s=p.read_text(encoding='utf-8')
          anchor='import { useEffect, useState } from "react";'
          if 'EstateConstellation' not in s:
              assert anchor in s
              s=s.replace(anchor, anchor+'\nimport EstateConstellation from "@/components/EstateConstellation";',1)
          marker='      {/* Portfolio Sections with Parallax */}'
          if '<EstateConstellation />' not in s:
              assert marker in s
              s=s.replace(marker,'      <EstateConstellation />\n\n'+marker,1)
          replacements={
            'CORE EXPERTISE':'ACTIVE SYSTEMS',
            'Three pillars of innovation driving technological sovereignty':'Interdependent systems operating across intelligence, matter, community infrastructure, and regenerative return',
            'RESEARCH & INNOVATION':'RESEARCH LEDGER',
            'Advancing the frontier of sovereign technology and community\n              resilience':'Current investigations, operating systems, and evidence paths across the estate',
            'IMPACT METRICS':'OPERATING SIGNALS',
            'Quantified excellence across key domains':'Directional portfolio signals — not self-awarded scores of excellence',
          }
          for old,new in replacements.items():
              if old in s:
                  s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          print('TRAI_ATOMIC_PRESTIGE=PASS')
          PY
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write client/src/pages/Home.tsx client/src/components/EstateConstellation.tsx
      - name: Commit application changes only
        run: |
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/Home.tsx client/src/components/EstateConstellation.tsx
          git diff --cached --quiet || git commit -m 'feat(prestige): reveal seven-organ estate architecture'
          git push origin HEAD:feat/prestige-estate-20260823
