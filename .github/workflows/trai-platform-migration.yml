name: TRAI platform migration

on:
  push:
    branches:
      - build/vite8-trai-observer-20260817

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: build/vite8-trai-observer-20260817
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Run guarded migration
        run: bash scripts/run-trai-platform-migration.sh
